{{- range $host := .Values.hosts }}
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: {{ $host }}-dr
spec:
  host: {{ $host }}
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    portLevelSettings:
      - port:
          number: 80
        tls:
          mode: SIMPLE
---
{{- end }}